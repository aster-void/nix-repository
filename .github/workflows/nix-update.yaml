name: Auto Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to update (leave empty for all)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix:
    name: Build Matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            echo 'packages=["${{ inputs.package }}"]' >> "$GITHUB_OUTPUT"
          else
            packages=$(jq -c '[.packages[].name]' auto-update.json)
            echo "packages=$packages" >> "$GITHUB_OUTPUT"
          fi

  update:
    name: Update ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: aster-void
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run update
        id: update
        run: nix develop -c ./scripts/update-package.sh "${{ matrix.package }}"

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/${{ matrix.package }}
          delete-branch: true
          title: "packages/${{ matrix.package }}: ${{ steps.update.outputs.old_version }} -> ${{ steps.update.outputs.new_version }}"
          commit-message: "packages/${{ matrix.package }}: ${{ steps.update.outputs.old_version }} -> ${{ steps.update.outputs.new_version }}"
          body: |
            Automated update for `${{ matrix.package }}`

            | | Version |
            |---|---|
            | Old | `${{ steps.update.outputs.old_version }}` |
            | New | `${{ steps.update.outputs.new_version }}` |

            ---
            *This PR was automatically created by the update workflow.*
          labels: |
            automated
            update
