name: Auto Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to update (leave empty for all)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix:
    name: Build Matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            echo 'packages=["${{ inputs.package }}"]' >> "$GITHUB_OUTPUT"
          else
            echo "packages=$(jq -c . packages.json)" >> "$GITHUB_OUTPUT"
          fi

  update:
    name: Update ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: nix-repository--aster-void
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run update
        id: update
        run: nix develop -c ./scripts/update-package.sh "${{ matrix.package }}"

      - name: Create Pull Request
        id: create-pr
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/${{ matrix.package }}
          delete-branch: true
          title: "packages/${{ matrix.package }}: ${{ steps.update.outputs.old_version }} -> ${{ steps.update.outputs.new_version }}"
          body: |
            Automated update for `${{ matrix.package }}`

            | | Version |
            |---|---|
            | Old | `${{ steps.update.outputs.old_version }}` |
            | New | `${{ steps.update.outputs.new_version }}` |

            ---
            *This PR was automatically created by the update workflow.*
          labels: |
            automated
            update

      - name: Check format
        id: check-format
        if: steps.update.outputs.updated == 'true'
        continue-on-error: true
        run: nix fmt -- --fail-on-change

      - name: Build package
        id: build
        if: steps.update.outputs.updated == 'true'
        continue-on-error: true
        run: nix build .#${{ matrix.package }} --print-build-logs

      - name: Run check script
        id: check-script
        if: steps.update.outputs.updated == 'true'
        continue-on-error: true
        run: |
          if [ -x "./packages/${{ matrix.package }}/check.sh" ]; then
            ./packages/${{ matrix.package }}/check.sh
          fi

      - name: Report check results
        if: steps.update.outputs.updated == 'true' && steps.create-pr.outputs.pull-request-number
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pull-request-number }}"
          FORMAT_RESULT="${{ steps.check-format.outcome }}"
          BUILD_RESULT="${{ steps.build.outcome }}"
          CHECK_RESULT="${{ steps.check-script.outcome }}"

          if [ "$FORMAT_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ] && [ "$CHECK_RESULT" = "success" ]; then
            gh pr edit "$PR_NUMBER" --add-label "checks-passed"
            gh pr comment "$PR_NUMBER" --body "✅ All checks passed"
          else
            gh pr edit "$PR_NUMBER" --add-label "checks-failed"
            COMMENT="## ❌ Some checks failed\n\n"
            COMMENT+="| Check | Result |\n|---|---|\n"
            COMMENT+="| Format | $FORMAT_RESULT |\n"
            COMMENT+="| Build | $BUILD_RESULT |\n"
            COMMENT+="| Check script | $CHECK_RESULT |\n"
            echo -e "$COMMENT" | gh pr comment "$PR_NUMBER" --body-file -
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if checks failed
        if: steps.update.outputs.updated == 'true'
        run: |
          if [ "${{ steps.check-format.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.check-script.outcome }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
